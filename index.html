// SHA-256 murni JS (sinkron, konsisten di semua lingkungan) untuk menyimpan sandi siswa
function sha256(msg) {
  const bytes = [...new TextEncoder().encode(msg)];
  const primes = []; for (let c = 2; primes.length < 64; c++) { if (primes.every(p => c % p)) primes.push(c); }
  const frac = x => Math.floor((x - Math.floor(x)) * 4294967296);
  const K = primes.map(p => frac(Math.cbrt(p)));
  let H = primes.slice(0, 8).map(p => frac(Math.sqrt(p)));
  const l = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (const v of [Math.floor(l / 4294967296), l >>> 0]) for (let s = 24; s >= 0; s -= 8) bytes.push((v >>> s) & 255);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < bytes.length; i += 64) {
    const w = new Array(64);
    for (let t = 0; t < 16; t++) w[t] = (bytes[i + t * 4] << 24) | (bytes[i + t * 4 + 1] << 16) | (bytes[i + t * 4 + 2] << 8) | bytes[i + t * 4 + 3];
    for (let t = 16; t < 64; t++) {
      const s0 = rr(w[t - 15], 7) ^ rr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      const s1 = rr(w[t - 2], 17) ^ rr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[t] + w[t]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [H[0] + a, H[1] + b, H[2] + c, H[3] + d, H[4] + e, H[5] + f, H[6] + g, H[7] + h].map(x => x | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

// CSV: parser (deteksi pemisah , atau ;) dan pembuat
function parseCSV(text) {
  text = String(text).replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = (first.split(';').length > first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch === '\r') { /* abaikan */ }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function toCSV(rows) {

}

// Pembangkit acak berbiji (agar soal contoh konsisten)
function rngFrom(seedStr) {
  let h = 1779033703 ^ String(seedStr).length;
  for (let i = 0; i < seedStr.length; i++) { h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = (h ^ (h >>> 16)) >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// =====================================================================
//  PUSTAKA GENERATOR SOAL — builder bermetadata, stimulus (teks/tabel/gambar SVG),
//  validator otomatis, perakit paket berbasis kisi-kisi

// =====================================================================
const LABEL_BS = { BS: ['Benar', 'Salah'], SESUAI: ['Sesuai', 'Tidak Sesuai'] };
const SL = ['mudah', 'sedang', 'sulit'];
const LV = ['Pemahaman', 'Penerapan', 'Penalaran'];
const KAT_BIND = { A: 'Pemahaman Tekstual', B: 'Pemahaman Inferensial', C: 'Evaluasi dan Apresiasi' };
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const kpk = (a, b) => a / gcd(a, b) * b;
const isPrime = n => n > 1 && range(2, Math.floor(Math.sqrt(n))).every(d => n % d);
const uniq = a => [...new Set(a)];
const idn = n => { n = Math.round(n * 1e6) / 1e6; const neg = n < 0; const [i, d] = String(Math.abs(n)).split('.'); return (neg ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + d : ''); };
const rp = n => 'Rp' + idn(n);
const Fr = (n, d) => `{${n}/${d}}`;            // pecahan bertumpuk
const FrM = (w, n, d) => `{${w} ${n}/${d}}`;   // pecahan campuran
const plain = s => String(s).replace(/\{(?:(\d+) )?(\d+)\/(\d+)\}/g, (m, w, n, d) => (w ? w + ' ' : '') + n + '/' + d);
function rich(s) { return esc(s).replace(/\{(?:(\d+) )?(\d+)\/(\d+)\}/g, (m, w, n, d) => (w ? `<span class="fw">${w}</span>` : '') + `<span class="fr"><i>${n}</i><i>${d}</i></span>`); }
const nrm = s => plain(s).toLowerCase().replace(/[\s.,;:!?'"()]+/g, ' ').trim();
const GEN_WARN = [];

// ---------- builder stimulus ----------
const stP = (isi, judul, gaya) => { const b = { t: 'p', isi }; if (judul) b.judul = judul; if (gaya) b.gaya = gaya; return b; };
const stDlg = (baris, judul) => { const b = { t: 'dlg', baris: baris.map(x => ({ n: x[0], k: x[1] })) }; if (judul) b.judul = judul; return b; };

const stFig = f => ({ t: 'fig', f });

// ---------- builder soal ----------
function metaOf(o) {
  const m = { materi: o.materi || '', sub: o.sub || '', indikator: o.ind || '', level: o.lv || '', sulit: o.sl || '', tag: [].concat(o.tag || []).map(String) };
  if (o.kat) { m.kat = o.kat; }
  if (o.stim && o.stim.length) m.stim = o.stim;
  return m;
}
function sortNum(arr) { const v = s => { const m = plain(s).replace(/\./g, '').replace(',', '.').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : 0; }; return [...arr].sort((a, b) => v(a) - v(b)); }
function cekPemb(o, benar) { const b = nrm(String(benar)).replace(/ /g, ''); if (b && !nrm(o.pemb || '').replace(/ /g, '').includes(b)) GEN_WARN.push('pembahasan tidak memuat jawaban: ' + String(o.teks).slice(0, 60)); }
function PG(r, o) {
  let opsi, kunci;
  if (o.opsi) { opsi = o.opsi.map(String); kunci = o.kunci; }
  else {
    const b = String(o.benar), sal = uniq(o.salah.map(String)).filter(x => nrm(x) !== nrm(b));
    if (sal.length < 3) throw new Error('Pengecoh kurang: ' + o.teks);
    const pil = [b, ...rSome(r, sal, 3)];
    opsi = o.urut ? sortNum(pil) : rShuf(r, pil); kunci = opsi.indexOf(b); cekPemb(o, b);
  }
  return { tipe: 'pg', teks: o.teks, opsi, kunci, pembahasan: o.pemb, ...metaOf(o) };
}
function MC(r, o) {
  const b = uniq(o.benar.map(String)), sal = uniq(o.salah.map(String)).filter(x => !b.some(y => nrm(y) === nrm(x)));
  const nTot = o.n || 5, nS = Math.min(sal.length, nTot - b.length);
  if (b.length < 2 || nS < 1) throw new Error('MCMA butuh >=2 benar dan >=1 salah: ' + o.teks);
  let all = [...b.map(t => [t, 1]), ...rSome(r, sal, nS).map(t => [t, 0])];
  all = o.urut ? sortNum(all.map(x => x[0])).map(t => all.find(x => x[0] === t)) : rShuf(r, all);
  return { tipe: 'mcma', teks: o.teks, opsi: all.map(x => x[0]), kunci: all.map((x, i) => x[1] ? i : -1).filter(i => i >= 0), pembahasan: o.pemb, ...metaOf(o) };
}
function BS(r, o) {
  const lab = o.label || 'BS', Lb = LABEL_BS[lab], items = o.items;
  const pemb = (o.pemb ? o.pemb + '\n' : '') + items.map((x, i) => `${i + 1}. ${x[1] ? Lb[0] : Lb[1]} — ${x[2]}`).join('\n');
  return { tipe: 'bs', label: lab, teks: o.teks || 'Tentukan ' + Lb[0] + ' atau ' + Lb[1] + ' untuk setiap pernyataan berikut!', opsi: items.map(x => String(x[0])), kunci: items.map(x => !!x[1]), pembahasan: pemb, ...metaOf(o) };
}
// pembantu: acak benar/salah untuk pernyataan BS  (benar: teks benar, salah: teks salah, alasan)
function bsItem(r, benarTxt, salahTxt, alasan) { return r() < .5 ? [benarTxt, true, alasan] : [salahTxt, false, alasan]; }
// pastikan kombinasi BS tidak seragam
function bsMix(r, items) { if (items.length > 2 && items.every(x => x[1] === items[0][1])) { /* biarkan; validator memberi peringatan */ } return items; }

// ---------- renderer gambar (SVG / HTML) ----------
const n1 = x => Math.round(x * 10) / 10;
const sT = (x, y, t, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" text-anchor="${o.a || 'middle'}" font-size="${o.s || 12}"${o.b ? ' font-weight="700"' : ''} fill="${o.c || '#0f172a'}"${o.r ? ` transform="rotate(${o.r} ${n1(x)} ${n1(y)})"` : ''}>${esc(plain(t))}</text>`;
const sL = (x1, y1, x2, y2, o = {}) => `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${o.c || '#334155'}" stroke-width="${o.w || 1.6}"${o.d ? ` stroke-dasharray="${o.d}"` : ''}/>`;
const sR = (x, y, w, h, o = {}) => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" rx="${o.rx || 0}" fill="${o.f || 'none'}" stroke="${o.c || '#334155'}" stroke-width="${o.w || 1.6}"/>`;
const sP = (pts, o = {}) => `<polygon points="${pts.map(p => n1(p[0]) + ',' + n1(p[1])).join(' ')}" fill="${o.f || 'none'}" stroke="${o.c || '#1e40af'}" stroke-width="${o.w || 1.8}" stroke-linejoin="round"/>`;
const sC = (x, y, r, o = {}) => `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r)}" fill="${o.f || 'none'}" stroke="${o.c || '#1e40af'}" stroke-width="${o.w || 1.8}"/>`;
const svgW = (w, h, inner, lab) => `<svg class="fg" viewBox="0 0 ${w} ${h}" style="max-width:${w}px" role="img" aria-label="${esc(lab || 'Gambar')}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const FILL = '#dbeafe', STK = '#1e40af';
const rightMark = (x, y, dx, dy, s = 9) => sP([[x, y], [x + dx * s, y], [x + dx * s, y + dy * s], [x, y + dy * s]], { c: '#475569', w: 1.2, f: 'none' });
const tick = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1, nx = -dy / l * 5, ny = dx / l * 5; return sL(mx - nx, my - ny, mx + nx, my + ny, { c: '#b91c1c', w: 2 }); };
const gridParse = g => { const rows = (g || []).map(s => String(s).split(',').map(x => parseInt(x, 10) || 0)); const w = Math.max(1, ...rows.map(r => r.length)); return rows.map(r => { while (r.length < w) r.push(0); return r; }); };
const gridStr = rows => rows.map(r => r.join(','));
// data tampak: depan -> tinggi per kolom; samping(kanan) -> tinggi per baris (depan ke belakang); atas -> matriks [belakang..depan] bool
function tampakData(g, arah) {
  const m = gridParse(g), R = m.length, C = m[0].length;
  if (arah === 'depan') return range(0, C - 1).map(c => Math.max(...m.map(r => r[c])));
  if (arah === 'samping') return range(0, R - 1).map(r => Math.max(...m[r]));
  return range(0, R - 1).map(j => m[R - 1 - j].map(h => h > 0 ? 1 : 0));
}

function figBar(f) {
  const W = 440, H = 270, ml = 50, mr = 14, mt = 38, mb = 50, n = f.labels.length, maks = f.maks, step = f.langkah || Math.ceil(maks / 5);
  const pw = W - ml - mr, ph = H - mt - mb, bw = pw / n * .56; let s = sT(W / 2, 20, f.judul || '', { b: 1, s: 13 });

};

function buildSurvei(jenis) {
  const r = rngFrom('survei' + jenis);
  if (jenis === 'karakter') {
    return {
      jenis, judul: 'Survei Karakter', aspek: ASPEK_K,
      petunjuk: 'Bacalah setiap kasus atau pernyataan dengan teliti. Pilih satu jawaban yang paling menggambarkan sikap dan kebiasaanmu sehari-hari. Tidak ada jawaban benar atau salah, jawablah dengan jujur.',
      butir: KARAKTER_RAW.map((x, i) => {
        const [aspek, tipe, teks, opsi] = x;
        if (tipe === 'kasus') return { no: i + 1, aspek, tipe: 'kasus', teks, opsi: rShuf(r, opsi.map((t, k) => ({ t, s: 4 - k }))) };
        const rev = tipe === 'sikap-';
        return { no: i + 1, aspek, tipe: 'sikap', teks, opsi: SK_SETUJU.map((t, k) => ({ t, s: rev ? k + 1 : 4 - k })) };
      })
    };
  }
  return {
    jenis, judul: 'Survei Lingkungan Belajar (Sulingjar)', aspek: ASPEK_S,
    petunjuk: 'Bacalah setiap pernyataan tentang kondisi sekolah dan rumahmu. Pilih satu jawaban yang paling sesuai dengan keadaan yang sebenarnya, bukan yang kamu harapkan.',
    butir: SULINGJAR_RAW.map((x, i) => {
      const [aspek, skala, teks] = x, rev = skala.endsWith('-'), jenisSkala = skala.replace('-', '');
      const dasar = jenisSkala === 'setuju'
        ? [['Sangat Setuju', 4], ['Setuju', 3], ['Agak Setuju', 2], ['Tidak Setuju', 1]]
        : [['Tidak Pernah', 1], ['Jarang', 2], ['Sering', 3], ['Selalu', 4]];
      return { no: i + 1, aspek, tipe: jenisSkala, teks, opsi: dasar.map(([t, s]) => ({ t, s: rev ? 5 - s : s })) };
    })
  };
}
function kategoriSurvei(avg) { return avg >= 3.5 ? 'Sangat Baik' : avg >= 2.75 ? 'Baik' : avg >= 2 ? 'Cukup' : 'Perlu Perhatian'; }
// Ringkasan per aspek dari satu set jawaban {no: indeksOpsi}
function ringkasSurvei(doc, jawaban) {
  const agg = {};
  for (const b of doc.butir) {
    const j = jawaban[b.no]; if (j === undefined || j === null || !b.opsi[j]) continue;
    (agg[b.aspek] = agg[b.aspek] || []).push(b.opsi[j].s);
  }
  return Object.keys(doc.aspek).filter(k => agg[k]).map(k => {
    const avg = agg[k].reduce((a, b) => a + b, 0) / agg[k].length;
    return { key: k, nama: doc.aspek[k], avg: round2(avg), persen: Math.round(avg / 4 * 100), kategori: kategoriSurvei(avg) };
  });
}

function deepMerge(a, b) {
  const o = Array.isArray(a) ? [...a] : { ...(a || {}) };
  for (const k of Object.keys(b)) {
    const v = b[k];
    o[k] = (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) ? deepMerge(o[k], v) : v;
  }
  return o;
}
function previewBackend() {

}

function kreditSoal(s, j) {
  if (s.tipe === 'pg') return (j !== undefined && j !== null && j === s.kunci) ? 1 : 0;
  if (s.tipe === 'mcma') {
    if (!Array.isArray(j)) return 0;
    const a = [...j].sort((x, y) => x - y), k = [...s.kunci].sort((x, y) => x - y);
    return (a.length === k.length && a.every((v, i) => v === k[i])) ? 1 : 0;
  }
  if (s.tipe === 'bs') {
    if (!Array.isArray(j)) return 0;
    let ok = 0; s.kunci.forEach((v, i) => { if (j[i] === v) ok++; });
    return ok / s.kunci.length;
  }
  return 0;
}
function hitungSkor(soal, jawaban) {
  const detail = {}; let benar = 0;
  soal.forEach(s => { const k = round2(kreditSoal(s, jawaban[s.no])); detail[s.no] = k; benar += k; });
  const total = soal.length, skor = total ? round2(benar / total * 100) : 0, pr = predikat(skor);
  return { benar: round2(benar), total, skor, predikat: pr.k, ket: pr.t, detail };
}
function sudahDijawab(s, j) {
  if (j === undefined || j === null) return false;
  if (s.tipe === 'pg') return true;
  if (s.tipe === 'mcma') return Array.isArray(j) && j.length > 0;
  return Array.isArray(j) && s.kunci.every((_, i) => j[i] === true || j[i] === false);
}

async function lanjutUjian(m, p) {
  const id = S.user.username + '_' + m + '_' + p;

async function selesaiUjian(auto) {
  const E = S.exam; if (!E || E.final) return;
  E.final = true; stopExamTimers();
  const hs = hitungSkor(E.soal, E.jawaban), t = Date.now();
  const data = { status: 'selesai', jawaban: E.jawaban, selesai: t, skor: hs.skor, benar: hs.benar, total: hs.total, predikat: hs.predikat, detail: hs.detail, otomatis: !!auto };
  try {
    await DBI.merge('pengerjaan', E.id, data);
    await mergeProgres(progKey(E.m, E.p), { st: 'selesai', skor: hs.skor, k: hs.predikat, t: data.selesai });
  } catch (e) { E.final = false; toast('Gagal menyimpan hasil, periksa koneksi lalu coba lagi.', 'bd'); startExamTimers(); return; }
  if (auto) toast('Waktu habis. Jawaban Anda dikirim otomatis.', 'wr');
  S.scr = { name: 'hasil', m: E.m, p: E.p, hs, pg: { ...E.pg, ...data }, soal: E.soal };
  S.exam = null; render();
}
async function lihatHasil(m, p) {
  const id = S.user.username + '_' + m + '_' + p;
  const pg = await DBI.get('pengerjaan', id);
  if (!pg) { toast('Data pengerjaan tidak ditemukan.', 'bd'); return; }
  const paket = await muatPaket(m, p);
  const soal = paket ? paket.soal : [];
  const hs = soal.length ? hitungSkor(soal, pg.jawaban || {}) : { benar: pg.benar, total: pg.total, skor: pg.skor, predikat: pg.predikat, ket: predikat(pg.skor).t, detail: pg.detail || {} };
  S.scr = { name: 'hasil', m, p, hs: { ...hs, skor: pg.skor ?? hs.skor, benar: pg.benar ?? hs.benar, total: pg.total ?? hs.total, predikat: pg.predikat || hs.predikat, ket: predikat(pg.skor ?? hs.skor).t }, pg, soal };
  render();
}

async function kirimSurvei() {

}
async function lihatSurvei(jenis) {

    <li>Jawabanmu <b>tersimpan otomatis</b>. Kamu dapat berpindah soal dengan bebas melalui nomor soal.</li>
    <li>Paket yang sudah dikerjakan <b>tidak dapat diulang</b>. Tekan tombol <b>Selesai</b> setelah yakin, atau jawaban akan dikirim otomatis saat waktu habis.</li>
    <li>Skor = jumlah soal benar ÷ jumlah soal keseluruhan × 100. Predikat: A (90–100) Amat Baik, B (80–89) Baik, C (70–79) Cukup, D (&lt; 70) Perlu Bimbingan.</li>

    <li>Jawablah dengan <b>jujur</b>. Semua butir wajib dijawab sebelum dikirim.</li>
    <li>Survei hanya dapat diisi <b>satu kali</b>.</li>`;
  return `<div class="login-wrap"><div class="card" style="max-width:760px;width:100%">

    <div class="row mb"><span class="badge in">${jml} ${isU ? 'soal' : 'butir'}</span>${isU ? `<span class="badge wr">⏱ ${S.settings.durasiMenit} menit</span>` : ''}</div>

}
async function mulaiHitung() {
  const sc = S.scr; if (!sc || !sc.cek || sc.counting) return;

  for (const n of ['3', '2', '1']) { box.innerHTML = `<div class="cd"><div class="num">${n}</div></div>`; await sleep(1000); }

function exAnswer(act, i, v) {

  else { const cur = Array.isArray(E.jawaban[no]) ? [...E.jawaban[no]] : []; while (cur.length < s.opsi.length) cur.push(null); cur[i] = v === '1'; setJawaban(no, cur); }

async function swSimpan(edit) {

      await DBI.merge('siswa', u, upd);

async function swHapus(u) {

  closeModal();

async function swImpor(text) {
  const rows = parseCSV(text); if (!rows.length) { toast('File CSV kosong.', 'wr'); return; }
  let head = rows[0].map(c => c.trim().toLowerCase()), data = rows.slice(1);
  if (!head.includes('username')) { head = ['username', 'password', 'nama']; data = rows; }
  const iu = head.indexOf('username'), ip = head.indexOf('password'), inm = head.findIndex(h => h === 'nama' || h === 'label');
  let baru = 0, ubah = 0, gagal = 0;
  for (const r of data) {
    const u = (r[iu] || '').trim().toLowerCase(), p = ip >= 0 ? (r[ip] || '').trim() : '', l = inm >= 0 ? (r[inm] || '').trim() : '';
    if (!/^[a-z0-9._-]{3,30}$/.test(u) || p.length < 4) { gagal++; continue; }
    try {
      if (await DBI.get('siswa', u)) { await DBI.merge('siswa', u, { passHash: passHash(u, p), ...(l ? { label: l } : {}) }); ubah++; }
      else { await DBI.set('siswa', u, buatDokSiswa(u, p, l)); baru++; }
    } catch (e) { gagal++; }
  }
  toast(`Impor selesai: ${baru} baru, ${ubah} diperbarui, ${gagal} dilewati.`, gagal ? 'wr' : 'ok'); await loadAdm('siswa');
}

function aggSurvei(jenis) {
  const doc = (S.ad.svDocs || {})[jenis], res = (S.ad.sv || []).filter(x => x.jenis === jenis); if (!doc) return { doc: null, res, agg: [] };
  const sum = {}, cnt = {};
  res.forEach(r => doc.butir.forEach(b => { const j = (r.jawaban || {})[b.no]; if (j !== undefined && j !== null && b.opsi[j]) { sum[b.aspek] = (sum[b.aspek] || 0) + b.opsi[j].s; cnt[b.aspek] = (cnt[b.aspek] || 0) + 1; } }));
  return { doc, res, agg: Object.keys(doc.aspek).filter(k => cnt[k]).map(k => { const avg = sum[k] / cnt[k]; return { nama: doc.aspek[k], avg: round2(avg), persen: Math.round(avg / 4 * 100), kategori: kategoriSurvei(avg) }; }) };
}

  if (E.tipe === 'pg' && !(E.kunci >= 0 && E.kunci < opsi.length)) { toast('Pilih satu kunci jawaban.', 'wr'); return; }
  if (E.tipe === 'mcma' && !(Array.isArray(E.kunci) && E.kunci.length)) { toast('Centang minimal satu kunci jawaban.', 'wr'); return; }
  const so = { tipe: E.tipe, teks, opsi, kunci: E.kunci, pembahasan: E.pemb.trim(), mapel: B.m, materi: E.materi.trim(), sub: E.sub.trim(), indikator: E.ind.trim(), level: E.level.trim(), sulit: E.sulit, tag: E.tag.split(',').map(x => x.trim()).filter(Boolean), stim: [...textToStim(E.stim), ...(E.fig || [])] };
  if (E.tipe === 'bs') so.label = E.label || 'BS'; if (B.m === 'bind' && E.kat) so.kat = E.kat;
  const v = validasiSoal(so, B.m); if (v.err.length) { toast('Perbaiki dahulu: ' + v.err[0], 'wr'); return; }
  const soal = [...B.doc.soal].map(s => ({ ...s }));
  if (E.no) { const i = soal.findIndex(s => s.no === E.no); if (i >= 0) soal.splice(i, 1); }
  soal.splice(Math.max(0, Math.min(soal.length, (E.pos || soal.length + 1) - 1)), 0, so);
  try { await simpanPaket(B.m, B.p, soal); closeModal(); toast('Soal disimpan.', 'ok'); render(true); } catch (e) { toast('Gagal menyimpan: ' + (e.message || e), 'bd'); }
}

// ===== EVENT HANDLER (delegasi) =====
function cfResolve(v) { if (_cf) { const f = _cf; _cf = null; f(v); } }
async function segarkanSiswa() {
  if (S.role !== 'siswa' || !S.user) return;
  try { const d = await DBI.get('siswa', S.user.username); if (d) S.user = { ...d, username: S.user.username }; } catch (e) {}
}
async function doLogin(btn) {
  const siswa = (S.loginTab || 'siswa') === 'siswa';
  const v1 = $(siswa ? '#lg-u' : '#lg-e').value, v2 = $(siswa ? '#lg-p' : '#lg-ap').value;
  if (btn) { btn.disabled = true; btn.textContent = 'Memproses…'; }
  S.loginErr = '';
  try {
    if (siswa) { await loginSiswa(v1, v2); await muatPengaturan(); }
    else await loginAdmin(v1, v2);
    if (siswa) render();
  } catch (e) {
    const c = e && e.code ? String(e.code) : '';
    S.loginErr = siswa ? (e.message || 'Gagal masuk.') : (/invalid|wrong|user-not-found|credential/.test(c + (e.message || '')) ? 'Email atau password admin salah.' : /network/.test(c) ? 'Tidak dapat terhubung ke server.' : 'Gagal masuk: ' + (e.message || e));
    render(); const a = $(siswa ? '#lg-u' : '#lg-e'); if (a) a.value = v1;
  }
}
async function handleAct(a, t, e) {
  const d = t.dataset;
  switch (a) {
    case 'mo-bg': if (e.target === t) { cfResolve(false); closeModal(); } return;
    case 'close-modal': cfResolve(false); closeModal(); return;
    case 'cf-no': cfResolve(false); closeModal(); return;
    case 'cf-yes': cfResolve(true); return;
    case 'tab': S.loginTab = d.t; S.loginErr = ''; render(); return;
    case 'pasang': if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); } return;
    case 'keluar': await keluar(); return;
    case 'nav':
      S.page = d.p;
      if (S.role === 'admin') { await loadAdm(d.p); return; }
      await segarkanSiswa(); render(); return;
    case 'edit-bio': S.editBio = true; render(); return;
    case 'bio-batal': S.editBio = false; render(); return;
    case 'buka-paket': await segarkanSiswa(); await bukaPaket(d.m, parseInt(d.p, 10)); return;
    case 'buka-survei': await segarkanSiswa(); await bukaSurvei(d.j); return;
    case 'scr-batal': S.scr = null; await segarkanSiswa(); render(); return;
    case 'mulai': await mulaiHitung(); return;
    case 'lihat-review': S.scr = { ...S.scr, name: 'review' }; render(); return;
    case 'rv-kembali': S.scr = { ...S.scr, name: 'hasil' }; render(); return;
    case 'rv-goto': { const el = $('#rv' + d.n); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    // --- ujian ---
    case 'ex-pg': exAnswer('pg', parseInt(d.i, 10)); return;
    case 'ex-mc': exAnswer('mc', parseInt(d.i, 10)); return;
    case 'ex-bs': exAnswer('bs', parseInt(d.i, 10), d.v); return;
    case 'ex-prev': if (S.exam.idx > 0) { S.exam.idx--; renderQ(); window.scrollTo(0, 0); $('#tka-app').scrollTop = 0; } return;
    case 'ex-next': if (S.exam.idx < S.exam.soal.length - 1) { S.exam.idx++; renderQ(); $('#tka-app').scrollTop = 0; } return;
    case 'ex-goto': S.exam.idx = parseInt(d.i, 10); renderQ(); $('#tka-app').scrollTop = 0; return;
    case 'ex-selesai': await ujianSelesaiKonfirmasi(); return;
    case 'ex-keluar':
      if (await confirmBox('Keluar Sementara?', 'Jawaban tersimpan, tetapi <b>waktu tetap berjalan</b>. Kamu dapat melanjutkan dari menu mata pelajaran selama waktu belum habis.', 'Keluar', 'pri')) {
        closeModal(); await flushSave(); stopExamTimers(); S.exam = null; S.scr = null; await segarkanSiswa(); render();
      } return;
    // --- survei ---
    case 'sv-pilih': { const n = parseInt(d.n, 10); S.scr.jawab[n] = parseInt(d.i, 10); S.scr.miss = S.scr.miss.filter(x => x !== n); render(true); return; }
    case 'sv-kirim':
      if (await confirmBox('Kirim Survei?', 'Jawaban yang sudah dikirim tidak dapat diubah lagi.', 'Kirim', 'ok')) { closeModal(); await kirimSurvei(); } return;
    // --- admin ---
    case 'adm-refresh': await loadAdm(S.page); return;
    case 'sw-form': swForm(d.u); return;
    case 'sw-simpan': await swSimpan(d.u); return;
    case 'sw-del': await swHapus(d.u); return;
    case 'sw-impor': $('#csv-sw').click(); return;
    case 'sw-templ': downloadText('template-siswa-siap-tka.csv', toCSV([['username', 'password', 'nama'], ['siswa101', 'rahasia123', 'Siswa Kelas 6A No. 1'], ['siswa102', 'rahasia456', 'Siswa Kelas 6A No. 2']])); return;
    case 'peng-reset': await pengReset(d.id); return;
    case 'peng-ekspor': pengEkspor(); return;
    case 'sv-reset': await svReset(d.id); return;
    case 'sv-ekspor': svEkspor(); return;
    case 'st-simpan': await stSimpan(); return;
    case 'st-pulihkan': await stPulihkan(); return;
    case 'bk-sel': if (d.m) S.bank.m = d.m; if (d.p) S.bank.p = parseInt(d.p, 10); await loadAdm('bank'); return;
    case 'bk-impor': $('#csv-bank').click(); return;
    case 'bk-templ': bankTemplate(); return;
    case 'bk-ekspor': bankEkspor(); return;
    case 'bk-pulih':
      if (await confirmBox('Pulihkan Soal Contoh?', `Semua soal <b>${MAPEL[S.bank.m].nama} Paket ${S.bank.p}</b> diganti dengan soal contoh.`, 'Pulihkan', 'bad')) { closeModal(); await simpanPaket(S.bank.m, S.bank.p, GEN[S.bank.m](S.bank.p)); toast('Soal contoh dipulihkan.', 'ok'); render(true); } return;
    case 'bk-kosong':
      if (await confirmBox('Kosongkan Paket?', `Semua soal <b>${MAPEL[S.bank.m].nama} Paket ${S.bank.p}</b> akan dihapus.`, 'Kosongkan', 'bad')) { closeModal(); await simpanPaket(S.bank.m, S.bank.p, []); toast('Paket dikosongkan.', 'ok'); render(true); } return;
    case 'bk-hapus':
      if (await confirmBox('Hapus Soal?', `Soal nomor <b>${d.n}</b> akan dihapus dan nomor berikutnya digeser.`, 'Hapus', 'bad')) { closeModal(); await simpanPaket(S.bank.m, S.bank.p, S.bank.doc.soal.filter(s => String(s.no) !== d.n).map(s => ({ ...s }))); toast('Soal dihapus.', 'ok'); render(true); } return;
    case 'ed-open': edOpen(d.n ? parseInt(d.n, 10) : null); return;
    case 'ed-add': edSync(); S.ed.opsi.push(''); if (S.ed.tipe === 'bs') S.ed.kunci.push(true); edRender(); return;
    case 'ed-del': { edSync(); if (S.ed.opsi.length <= 2) { toast('Minimal 2 opsi.', 'wr'); return; } const i = parseInt(d.i, 10); S.ed.opsi.splice(i, 1);
      if (S.ed.tipe === 'bs') S.ed.kunci.splice(i, 1); else if (S.ed.tipe === 'mcma') S.ed.kunci = S.ed.kunci.filter(k => k !== i).map(k => k > i ? k - 1 : k); else S.ed.kunci = S.ed.kunci === i ? -1 : (S.ed.kunci > i ? S.ed.kunci - 1 : S.ed.kunci);
      edRender(); return; }
    case 'ed-simpan': await edSimpan(); return;
    case 'imp-do': await bankImporTerapkan(d.mode); return;
  }
}
document.addEventListener('click', async e => {
  const root = $('#tka-app'); if (!root || !root.contains(e.target)) return;
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  try { await handleAct(t.dataset.act, t, e); } catch (err) { console.error(err); toast('Terjadi kesalahan: ' + (err.message || err), 'bd'); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  try { if (f.dataset.form === 'login') await doLogin(f.querySelector('button[type=submit]')); else if (f.dataset.form === 'biodata') await submitBiodata(); }
  catch (err) { console.error(err); toast('Terjadi kesalahan: ' + (err.message || err), 'bd'); }
});
document.addEventListener('input', e => {
  const el = e.target; if (el.dataset.in !== 'nama') return;
  const v = el.value, up = v.toUpperCase(), w = $('#nm-warn');
  if (v !== up) { const s = el.selectionStart; el.value = up; try { el.setSelectionRange(s, s); } catch (x) {} if (w) { w.className = 'nm-warn'; w.textContent = '⚠ Nama harus HURUF KAPITAL SEMUA — huruf kecil otomatis diubah menjadi kapital.'; } }
  else if (w) { w.className = 'nm-warn good'; w.textContent = '✔ Penulisan nama sudah HURUF KAPITAL.'; }
});
document.addEventListener('change', async e => {
  const el = e.target, k = el.dataset && el.dataset.in;
  try {
    if (el.id === 'csv-sw' || el.id === 'csv-bank') {
      const f = el.files && el.files[0]; if (!f) return; const txt = await f.text(); el.value = '';
      if (el.id === 'csv-sw') await swImpor(txt); else bankImporModal(bankParse(txt)); return;
    }
    if (!k) return;
    if (k === 'cek') { S.scr.cek = el.checked; render(true); }
    else if (k === 'f-qs') { S.f.qs = el.value; render(true); }
    else if (k === 'f-q') { S.f.q = el.value; render(true); }
    else if (k === 'f-hm') { S.f.hm = el.value; render(true); }
    else if (k === 'f-hp') { S.f.hp = el.value; render(true); }
    else if (k === 'f-mode') { S.f.mode = el.value; render(true); }
    else if (k === 'ed-tipe') { edSync(); edConvert(el.value); edRender(); }
    else if (k === 'ed-label') { edSync(); edRender(); }
  } catch (err) { console.error(err); toast('Terjadi kesalahan: ' + (err.message || err), 'bd'); }
});

// ===== AUTENTIKASI ADMIN + BOOT =====
function onAuth(u) {
  if (u) {
    S.role = 'admin'; S.adminEmail = u.email || ''; S.user = null; S.scr = null; S.exam = null; S.page = 'dash';
    autoSetupDatabase().then(muatPengaturan).catch(() => {}).finally(() => loadAdm('dash'));
  } else if (S.role === 'admin') { S.role = null; render(); }
}
async function boot() {
  try {
    setupPWA();
    await initBackend();
    await autoSetupDatabase();
    await muatPengaturan();
    const u = ssGet('tka_u');
    if (u) { try { const d = await DBI.get('siswa', u); if (d) { S.role = 'siswa'; S.user = { ...d, username: u }; } } catch (e) {} }
    AUTH.onChange(onAuth);
    if (S.role !== 'admin') render();
  } catch (e) {
    console.error(e);
    $('#tka-root').innerHTML = `<div class="login-wrap"><div class="card login">${brandHTML()}<div class="alert bd"><b>Tidak dapat terhubung ke Firebase.</b><br>${esc(e.message || e)}</div><p class="small muted">Periksa <code>firebaseConfig</code>, koneksi internet, dan pastikan Firestore serta Authentication (Email/Password) sudah diaktifkan. Untuk mencoba tanpa Firebase, ubah <code>IS_PREVIEW</code> menjadi <code>true</code>.</p><button class="btn pri block" onclick="location.reload()">Muat Ulang</button></div></div>`;
  }
}
boot();
</script>
